<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warayut Burattanang — Links</title>
    <meta name="description" content="Warayut Burattanang — portfolio, writing, and where to find me online." />

    <!-- Open Graph (Facebook, LINE, Discord, etc.) -->
    <meta property="og:title" content="Warayut Burattanang — Links" />
    <meta property="og:description" content="Designer & developer · Year 3 KMUTNB Prachinburi · Portfolio + social links." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://warayutkub.github.io/linkfolio/" />
    <meta property="og:image" content="https://warayutkub.github.io/linkfolio/assets/profile.webp" />
    <meta property="og:image:alt" content="Warayut Burattanang" />
    <meta property="og:site_name" content="Warayut Burattanang" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Warayut Burattanang — Links" />
    <meta name="twitter:description" content="Designer & developer · Year 3 KMUTNB Prachinburi · Portfolio + social links." />
    <meta name="twitter:image" content="https://warayutkub.github.io/linkfolio/assets/profile.webp" />

    <meta name="theme-color" content="#F8FAFC" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A0A0A'/%3E%3Ctext x='50%25' y='60%25' text-anchor='middle' font-family='-apple-system,system-ui,sans-serif' font-size='17' font-weight='700' fill='%23FFFFFF'%3EW%3C/text%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/linkfolio.css" />
</head>
<body>
    <main class="linkfolio">
        <div class="linkfolio__inner">
            <header class="linkfolio__header">
                <div class="linkfolio__avatar" id="avatar"></div>
                <h1 class="linkfolio__name" id="name"></h1>
                <div class="linkfolio__divider"></div>
                <p class="linkfolio__tagline" id="tagline"></p>
            </header>

            <nav class="linkfolio__links" id="linkList" aria-label="External links">
                <!-- Rendered by scripts/linkfolio.js using data from scripts/data.js -->
            </nav>

            <footer class="linkfolio__footer">
                &copy; <span id="year"></span> &middot; <span id="footerName"></span>
            </footer>
        </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="donate" id="donateDialog" aria-labelledby="donateTitle">
        <button class="donate__close" type="button" data-action="close-donate" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <path d="M6 6l12 12M6 18L18 6" />
            </svg>
        </button>
        <div class="donate__body" id="donateBody">
            <!-- Rendered by scripts/linkfolio.js using donate config in scripts/data.js -->
        </div>
    </dialog>

    <script src="scripts/data.js" defer></script>
    <script src="scripts/linkfolio.js" defer></script>
</body>
</html>
